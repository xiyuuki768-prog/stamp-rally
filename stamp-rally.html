<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全国スタンプ帖</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--ink:#1c2a44;--paper:#f1f3ef;--seal:#c8352c;--line:#cfd5d0;--mut:#5d6878;--f:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:400 15px/1.5 var(--f);background:var(--paper);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:relative;z-index:2000;background:var(--ink);color:#fff;padding:10px 12px 10px;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:18px;margin:0;letter-spacing:.04em}
#count{background:var(--seal);border-radius:99px;padding:1px 12px;font-size:13px;font-weight:700}
.sw{position:relative}
#sf{display:flex;gap:6px}
#q{width:100%;min-width:0;font-size:16px;padding:9px 38px 9px 12px;border:0;border-radius:8px;color:var(--ink)}
#q::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.qw{position:relative;flex:1;min-width:0}
#qx{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--mut);font-size:16px;padding:0}
#sf>button{border:0;border-radius:8px;background:#fff;color:var(--ink);font-weight:700;padding:0 14px}
#res{position:absolute;left:0;right:0;top:100%;margin:6px 0 0;padding:4px;list-style:none;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 8px 24px #0004;max-height:50dvh;overflow:auto;z-index:2500}
#res button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px}
#res button:hover{background:var(--paper)}
#res small{display:block;color:var(--mut)}
#res .m{padding:10px;color:var(--mut)}
.flt{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px;margin-top:8px}
.flt select{min-width:0;font-size:14px;padding:6px;border:1px solid #ffffff55;border-radius:8px;background:#2b3d5e;color:#fff}
.flt option{background:#fff;color:var(--ink)}
main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;z-index:0}
#list{position:absolute;inset:0;overflow:auto;padding:12px}
body[data-v=list] #map,body[data-v=map] #list{display:none}
.it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.th{flex:none;width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--paper);display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--mut)}
.it .bd{flex:1;min-width:0}
.it b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{color:var(--mut)}
.st{flex:none;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;border:1px dashed var(--mut);color:var(--mut)}
.st.on{border:1px solid var(--seal);background:var(--seal);color:#fff}
.empty{text-align:center;color:var(--mut);padding:48px 16px}
nav{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:12px;font-weight:700;color:var(--mut);border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--seal)}
/* pins: 未訪問=白地+破線 / 獲得済み=朱色ベタ */
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 2px 6px #0006}
.pin b{transform:rotate(45deg);font:700 14px/1 var(--f)}
.pin.off{background:#fff;border:3px dashed var(--ink);color:var(--ink)}
.pin.on{background:var(--seal);border:3px solid #fff;color:#fff}
.pin.new{background:var(--ink);border:3px solid #fff;color:#fff}
#sheet{position:fixed;z-index:3000;left:0;right:0;bottom:0;max-height:72dvh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -6px 28px #0004;padding:14px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .25s,visibility .25s}
#sheet.open{transform:none;visibility:visible}
@media(min-width:800px){#sheet{left:auto;right:16px;bottom:16px;width:420px;max-height:calc(100dvh - 32px);border-radius:16px}}
@media(prefers-reduced-motion:reduce){#sheet{transition:none}}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd h2{margin:0;font-size:17px}
.x{background:none;border:0;color:var(--mut);padding:6px}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{font-size:12px;color:var(--mut);margin:6px 0 0}
fieldset{margin:16px 0 0;padding:12px;border:1px solid var(--line);border-radius:12px}
legend{padding:0 6px;font-weight:700}
#pv{position:relative;margin-top:10px;border-radius:10px;overflow:hidden;background:#e6e9e4}
#pv img{display:block;width:100%;max-height:46dvh;object-fit:contain}
.seal{position:absolute;right:10px;bottom:10px;width:62px;height:62px;border:3px solid var(--seal);border-radius:50%;background:#ffffffd9;color:var(--seal);display:grid;place-items:center;font-weight:700;font-size:28px;transform:rotate(-12deg)}
.btns{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;text-align:center;padding:9px;border:1px solid var(--ink);border-radius:8px;background:#fff;font-weight:700;margin:0;color:var(--ink);font-size:14px}
.act{display:flex;gap:10px;margin-top:16px}
.act button{padding:12px;border-radius:10px;font-weight:700;border:1px solid var(--line);background:#fff}
.act .pri{flex:1;background:var(--seal);border-color:var(--seal);color:#fff}
.act .del{color:var(--seal)}
#toast{position:fixed;z-index:4000;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;max-width:90%;text-align:center}
.lb{font-size:13px;color:var(--mut);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{position:relative;margin:0}
.chip input{position:absolute;opacity:0;width:0;height:0;margin:0;padding:0;border:0}
.chip span{display:block;padding:6px 12px;border:1px solid var(--line);border-radius:99px;font-size:14px;color:var(--ink);background:#fff}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.chip input:focus-visible+span{outline:2px solid var(--seal);outline-offset:2px}
.add{padding:6px 12px;border:1px dashed var(--mut);border-radius:99px;background:#fff;color:var(--mut);font-size:14px}
.lt{margin-bottom:10px}
.mk{width:100%;padding:10px;border:1px dashed var(--mut);border-radius:10px;background:#fff;font-weight:700;color:var(--ink)}
.gp{margin-bottom:14px}
.gh{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.tgl{flex:1;text-align:left;background:none;border:0;padding:6px 0;font-size:16px}
.tgl small{color:var(--mut);margin-left:6px}
.mn{background:none;border:0;color:var(--mut);font-size:13px;padding:6px}
.hint{color:var(--mut);font-size:13px;margin:4px 0 8px}
.cs{display:flex;align-items:center;gap:8px;margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.cs b{font-size:16px}
.cs small{color:var(--mut);flex:1}
.cs .add{padding:4px 10px;font-size:13px}
.lk{float:right;background:none;border:0;color:var(--seal);font-size:13px;padding:0 4px}
.chips.del .chip span{border-color:var(--seal);color:var(--seal)}
.chips.del .chip span::after{content:' ✕'}
.chips.del .chip input:checked+span{background:#fff}
</style>
</head>
<body data-v="map">
<header>
  <div class="top"><h1>全国スタンプ帖</h1><span id="count">0 / 0 獲得</span></div>
  <div class="sw">
    <form id="sf"><span class="qw"><input id="q" type="search" placeholder="地名・スポット名で検索" autocomplete="off"><button type="button" id="qx" hidden aria-label="入力を消す">✕</button></span><button>検索</button></form>
    <ul id="res" hidden></ul>
  </div>
  <div class="flt"><select id="flr" aria-label="地域"></select><select id="flc" aria-label="種類"></select><select id="flt" aria-label="作品・タグ"></select></div>
</header>
<main>
  <div id="map"></div>
  <section id="list"></section>
</main>
<nav><button data-v="map" class="on">地図</button><button data-v="list">一覧</button></nav>

<form id="sheet" aria-label="スポット詳細">
  <div class="hd"><h2 id="stt"></h2><button type="button" class="x" id="cl">閉じる</button></div>
  <label>名称<input id="nm" required maxlength="100"></label>
  <div id="pv" hidden></div>
  <p class="sub" id="coord"></p>
  <label>地域<select id="rg" required></select></label>
  <div class="lb">種類（複数選べます）<button type="button" class="lk" id="ctm">削除モード</button></div><div class="chips" id="cts"></div>
  <div class="lb">作品名・タグ（複数選べます）<button type="button" class="lk" id="tgm">削除モード</button></div><div class="chips" id="tgs"></div>
  <div id="fds"></div>
  <fieldset>
    <legend>スタンプ</legend>
    <p class="sub" id="ph0">写真を選ぶとスタンプを獲得できます</p>
    <div class="btns">
      <label class="btn">写真を選ぶ<input id="ph" type="file" accept="image/*" hidden></label>
      <button type="button" class="btn" id="rm">写真を外す</button>
    </div>
    <label>訪問日<input id="vd" type="date"></label>
    <label>メモ<textarea id="mm" rows="3" maxlength="1000"></textarea></label>
  </fieldset>
  <div class="act"><button type="button" class="del" id="del">削除</button><button class="pri" id="sv">保存</button></div>
</form>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const askName = (m, v = '') => (prompt(m, v) || '').trim().slice(0, 30);

/* ---------- マスタ ---------- */
const REGIONS = ['北海道・東北','関東','中部','近畿','中国・四国','九州・沖縄'];
const CATS = {'アニメ聖地':'聖','グルメ':'食','観光':'観','その他':'他'};
const glyph = c => CATS[c] || [...(c || '他')][0];
// 種類 = 標準4種 + 登録済みスポットで使われている種類（自分で追加した分は保存すると残る）
const cats = () => { const l = [...new Set([...Object.keys(CATS).filter(c => !hiddenCats.includes(c)), ...spots.flatMap(s => s.categories), ...folders.map(f => f.category)])]; return l.length ? l : ['その他']; };
const tagList = () => [...new Set(spots.flatMap(s => s.tags))].sort();
// 旧データ（category / tag が1つだけ）を複数対応の形に変換
const norm = s => { s.categories = s.categories || (s.category ? [s.category] : []); s.tags = s.tags || (s.tag ? [s.tag] : []); s.folderIds = s.folderIds || (s.folderId ? [s.folderId] : []); delete s.folderId; delete s.category; delete s.tag; return s; };
const PREF = [
  '北海道 青森県 岩手県 宮城県 秋田県 山形県 福島県',
  '茨城県 栃木県 群馬県 埼玉県 千葉県 東京都 神奈川県',
  '新潟県 富山県 石川県 福井県 山梨県 長野県 岐阜県 静岡県 愛知県',
  '三重県 滋賀県 京都府 大阪府 兵庫県 奈良県 和歌山県',
  '鳥取県 島根県 岡山県 広島県 山口県 徳島県 香川県 愛媛県 高知県',
  '福岡県 佐賀県 長崎県 熊本県 大分県 宮崎県 鹿児島県 沖縄県'];
const regionOf = st => { const i = PREF.findIndex(g => g.split(' ').includes(st)); return i < 0 ? '' : REGIONS[i]; };

/* ---------- データ層 ----------
   画面側は Store の5メソッドしか使わない。
   クラウドDB・PC同期を足すときは、同じ形のオブジェクト（Firestore/Supabase等）に差し替える。
   spots: {id, name, lat, lng, region, categories[], tags[], folderIds[], visited, visitDate, memo, createdAt, updatedAt}
   folders: {id, name, category, createdAt, updatedAt}   ※フォルダは種類ごとに作る
   meta: {key, value}   ※設定（削除した標準の種類など）
   photos: {spotId, blob, updatedAt}  ※写真は別ストアに分離（同期時に個別アップロードしやすい） */
const Store = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((ok, ng) => {
    const r = indexedDB.open('stamp-rally', 3);
    r.onupgradeneeded = () => {
      const d = r.result;
      [['spots', 'id'], ['photos', 'spotId'], ['folders', 'id'], ['meta', 'key']].forEach(([n, k]) => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath: k}); });
    };
    r.onblocked = () => toast('他のタブでこのアプリを開いている場合は閉じて、再読み込みしてください');
    r.onsuccess = () => { r.result.onversionchange = () => r.result.close(); ok(r.result); };
    r.onerror = () => ng(r.error);
  });
  const run = async (names, mode, fn) => {
    const d = await open();
    return new Promise((ok, ng) => {
      const t = d.transaction(names, mode); let r;
      try { r = fn(...names.map(n => t.objectStore(n))); } catch (e) { return ng(e); }
      t.oncomplete = () => ok(r && r.result);
      t.onerror = t.onabort = () => ng(t.error);
    });
  };
  return {
    spots:  () => run(['spots'], 'readonly', s => s.getAll()),
    photos: () => run(['photos'], 'readonly', p => p.getAll()),
    folders: () => run(['folders'], 'readonly', f => f.getAll()),
    saveFolder: f => run(['folders'], 'readwrite', s => s.put(f)),
    removeFolder: id => run(['folders'], 'readwrite', s => s.delete(id)),
    getMeta: async k => (await run(['meta'], 'readonly', m => m.get(k)))?.value,
    setMeta: (k, value) => run(['meta'], 'readwrite', m => m.put({key: k, value})),
    // photo: undefined=変更なし / Blob=差し替え / null=削除
    save: (spot, photo) => run(['spots', 'photos'], 'readwrite', (s, p) => {
      if (photo === null) p.delete(spot.id);
      else if (photo) p.put({spotId: spot.id, blob: photo, updatedAt: spot.updatedAt});
      return s.put(spot);
    }),
    remove: id => run(['spots', 'photos'], 'readwrite', (s, p) => { p.delete(id); return s.delete(id); })
  };
})();

/* ---------- 状態 ---------- */
let spots = [], folders = [], hiddenCats = [], collapsed = new Set(), photoURL = {}, F = {r: '', c: '', t: ''}, cur = null, tmp = null;

/* ---------- 地図 ---------- */
const map = L.map('map', {zoomControl: false}).setView([37.5, 137.5], 5);
const gsi = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>'}).addTo(map);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap contributors'});
L.control.layers({'地理院地図': gsi, 'OpenStreetMap': osm}).addTo(map);
L.control.zoom({position: 'bottomright'}).addTo(map);
const layer = L.layerGroup().addTo(map);
const icon = (s, cls) => L.divIcon({className: '', html: `<div class="pin ${cls}"><b>${s ? glyph(s.categories[0]) : '＋'}</b></div>`, iconSize: [30, 30], iconAnchor: [15, 36]});

map.on('click', e => { hideRes(); startNew({lat: e.latlng.lat, lng: e.latlng.lng}); });

/* ---------- 絞り込み・描画 ---------- */
const fillSel = (el, ph, arr) => el.innerHTML = `<option value="">${ph}</option>` + arr.map(v => `<option>${esc(v)}</option>`).join('');
fillSel($('#flr'), '地域：すべて', REGIONS);
fillSel($('#rg'), '選択…', REGIONS);
['flr', 'flc', 'flt'].forEach(id => $('#' + id).onchange = () => {
  F = {r: $('#flr').value, c: $('#flc').value, t: $('#flt').value};
  try { localStorage.setItem('stamp-c', F.c); } catch {}   // 最後に見た種類を覚える
  render(); fit();
});

const filtered = () => spots.filter(s => (!F.r || s.region === F.r) && (!F.c || s.categories.includes(F.c)) && (!F.t || s.tags.includes(F.t)));

function fit() {
  const p = filtered().map(s => [s.lat, s.lng]);
  if (p.length && document.body.dataset.v === 'map') map.fitBounds(p, {padding: [60, 60], maxZoom: 14});
}

function render() {
  const tags = tagList();
  if (F.t && !tags.includes(F.t)) F.t = '';
  $('#flt').innerHTML = '<option value="">作品・タグ：すべて</option>' + tags.map(t => `<option ${t === F.t ? 'selected' : ''}>${esc(t)}</option>`).join('');
  const cl = cats();
  if (!cl.includes(F.c)) F.c = cl[0];
  $('#flc').innerHTML = cl.map(c => `<option ${c === F.c ? 'selected' : ''}>${esc(c)}</option>`).join('');
  $('#flr').value = F.r;

  const shown = filtered();
  layer.clearLayers();
  shown.forEach(s => L.marker([s.lat, s.lng], {icon: icon(s, s.visited ? 'on' : 'off'), title: s.name}).on('click', () => openSheet(s)).addTo(layer));
  $('#count').textContent = `${shown.filter(s => s.visited).length} / ${shown.length} 獲得`;

  const item = s => `
    <button class="it" data-id="${s.id}">
      ${photoURL[s.id] ? `<img class="th" src="${photoURL[s.id]}" alt="">` : `<span class="th">${glyph(s.categories[0])}</span>`}
      <span class="bd"><b>${esc(s.name)}</b><small>${esc([s.region, ...s.categories, ...s.tags].join('・'))}${s.visited && s.visitDate ? '・' + esc(s.visitDate) : ''}</small></span>
      <span class="st ${s.visited ? 'on' : ''}">${s.visited ? '獲得' : '未訪問'}</span>
    </button>`;
  const sorted = [...shown].sort((a, b) => b.createdAt - a.createdAt);
  const active = F.r || F.c || F.t;
  const grp = (key, name, items, f) => `<section class="gp"><div class="gh"><button class="tgl" data-t="${esc(key)}">${collapsed.has(key) ? '▸' : '▾'} <b>${esc(name)}</b><small>${items.length}件</small></button>${f ? `<button class="mn" data-r="${f.id}">名前変更</button><button class="mn" data-d="${f.id}">削除</button>` : ''}</div>${collapsed.has(key) ? '' : items.map(item).join('') || '<p class="hint">空です。スポット詳細の「フォルダ」で入れられます</p>'}</section>`;
  // 種類ごとのセクション：フォルダはその種類の中だけ。他の種類にも属するスポットは、そちらの種類では（フォルダに入っていなければ）未分類として普通に出る
  const sec = c => {
    const inC = sorted.filter(s => s.categories.includes(c));
    const fs = folders.filter(f => f.category === c).sort((a, b) => a.createdAt - b.createdAt);
    const hasMember = f => spots.some(s => s.folderIds.includes(f.id) && s.categories.includes(c));
    const gs = fs.map(f => [f, inC.filter(s => s.folderIds.includes(f.id))]).filter(([f, it]) => it.length || !active || !hasMember(f));
    const loose = inC.filter(s => !fs.some(f => s.folderIds.includes(f.id)));
    if (!inC.length && !gs.length && F.c !== c) return '';
    return `<div class="cs"><b>${esc(c)}</b><small>${inC.length}件</small><button class="add" data-nf="${esc(c)}">＋ フォルダ</button></div>`
      + gs.map(([f, it]) => grp(f.id, f.name, it, f)).join('') + (loose.length ? grp('_' + c, '未分類', loose) : '');
  };
  const html = cats().map(c => F.c && F.c !== c ? '' : sec(c)).join('');
  $('#list').innerHTML = html || `<p class="empty">${spots.length ? '条件に合うスポットがありません' : '地図をタップするか、検索して、最初のスポットを登録しましょう'}</p>`;
}

$('#list').onclick = async e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  try {
    if (d.nf) { const n = askName(`「${d.nf}」のフォルダ名`); if (n) await addFolder(n, d.nf); }
    else if (d.t) { collapsed.has(d.t) ? collapsed.delete(d.t) : collapsed.add(d.t); render(); }
    else if (d.r) {
      const f = folders.find(x => x.id === d.r), n = askName('フォルダ名', f.name);
      if (n) { f.name = n; f.updatedAt = Date.now(); await Store.saveFolder(f); render(); }
    } else if (d.d) {
      const f = folders.find(x => x.id === d.d);
      if (!confirm(`フォルダ「${f.name}」（${f.category}）を削除しますか？\nスポットは削除されません。`)) return;
      const moved = spots.filter(x => x.folderIds.includes(f.id));
      moved.forEach(x => { x.folderIds = x.folderIds.filter(i => i !== f.id); x.updatedAt = Date.now(); });
      await Promise.all(moved.map(x => Store.save(x)));
      await Store.removeFolder(f.id);
      folders = folders.filter(x => x.id !== f.id); render();
    } else if (d.id) {
      const sp = spots.find(x => x.id === d.id);
      setView('map'); map.setView([sp.lat, sp.lng], 15); openSheet(sp);
    }
  } catch { toast('保存に失敗しました'); }
};

function setView(v) {
  document.body.dataset.v = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'map') map.invalidateSize();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => setView(b.dataset.v));

/* ---------- 検索（Nominatim） ---------- */
const hideRes = () => $('#res').hidden = true;
$('#q').oninput = e => { $('#qx').hidden = !e.target.value; if (!e.target.value) hideRes(); };
$('#qx').onclick = () => { $('#q').value = ''; $('#qx').hidden = true; hideRes(); $('#q').focus(); };
$('#sf').onsubmit = async e => {
  e.preventDefault();
  const q = $('#q').value.trim(); if (!q) return;
  const ul = $('#res'); ul.hidden = false; ul.innerHTML = '<li class="m">検索中…</li>';
  try {
    const r = await (await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&countrycodes=jp&limit=8&addressdetails=1&accept-language=ja`)).json();
    if (!r.length) { ul.innerHTML = '<li class="m">見つかりませんでした。別の表記でお試しください</li>'; return; }
    ul._r = r;
    ul.innerHTML = r.map((x, i) => {
      const p = x.display_name.split(', ');
      return `<li><button type="button" data-i="${i}"><b>${esc(x.name || p[0])}</b><small>${esc(p.slice(1, 4).join(' '))}</small></button></li>`;
    }).join('');
  } catch { ul.innerHTML = '<li class="m">検索に失敗しました。通信状況を確認してください</li>'; }
};
$('#res').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const x = e.currentTarget._r[b.dataset.i], ll = [+x.lat, +x.lon];
  hideRes(); setView('map'); map.flyTo(ll, 16);
  startNew({lat: ll[0], lng: ll[1], name: x.name || x.display_name.split(', ')[0], region: regionOf(x.address?.state)});
};

/* ---------- 登録・詳細シート ---------- */
function startNew(p) {
  openSheet({id: uid(), name: p.name || '', lat: p.lat, lng: p.lng, region: p.region || '', categories: F.c ? [F.c] : [], tags: [], folderIds: [], visited: false, visitDate: '', memo: ''}, true);
  if (!p.name || !p.region) reverse(p);
}

async function reverse(p) {
  const id = cur.spot.id;
  try {
    const r = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${p.lat}&lon=${p.lng}&zoom=18&addressdetails=1&accept-language=ja`)).json();
    if (!cur || cur.spot.id !== id) return;
    const a = r.address || {};
    if (!$('#nm').value && !$('#nm').dataset.d) $('#nm').value = r.name || a.road || a.neighbourhood || a.suburb || '';
    const rg = regionOf(a.state || a.province);
    if (rg && !$('#rg').value) $('#rg').value = rg;
  } catch {}
}

function clearTmp() { if (tmp) { map.removeLayer(tmp); tmp = null; } }

function openSheet(spot, isNew) {
  clearTmp();
  if (cur && cur.url) URL.revokeObjectURL(cur.url);
  cur = {spot: {...spot}, isNew: !!isNew, photo: undefined, url: null};
  if (isNew) {
    tmp = L.marker([spot.lat, spot.lng], {icon: icon(null, 'new'), draggable: true}).addTo(map).on('dragend', e => {
      const p = e.target.getLatLng(); cur.spot.lat = p.lat; cur.spot.lng = p.lng; showCoord();
    });
  }
  $('#stt').textContent = isNew ? '新しいスポット' : 'スポットの詳細';
  $('#nm').value = spot.name; delete $('#nm').dataset.d;
  $('#rg').value = spot.region; cur.fids = [...spot.folderIds]; drawChips('#cts', cats(), spot.categories); drawChips('#tgs', tagList(), spot.tags); drawFds();
  [['#cts', '#ctm'], ['#tgs', '#tgm']].forEach(([b, t]) => { $(b).classList.remove('del'); $(t).textContent = '削除モード'; });
  $('#vd').value = spot.visitDate || ''; $('#mm').value = spot.memo || '';
  $('#del').hidden = !!isNew;
  showCoord(); showPhoto();
  $('#sheet').classList.add('open');
  if (innerWidth < 800) {   // ピンがシートに隠れないよう上へ寄せる
    const h = $('#map').clientHeight, y = map.latLngToContainerPoint([spot.lat, spot.lng]).y;
    if (y > h * .3) map.panBy([0, y - h * .15]);
  }
}

function closeSheet() {
  clearTmp();
  if (cur && cur.url) URL.revokeObjectURL(cur.url);
  cur = null;
  $('#sheet').classList.remove('open');
}

const showCoord = () => $('#coord').textContent = `緯度 ${cur.spot.lat.toFixed(5)} / 経度 ${cur.spot.lng.toFixed(5)}` + (cur.isNew ? '（ピンはドラッグで微調整できます）' : '');

function showPhoto() {
  const src = cur.photo === null ? null : cur.photo ? cur.url : photoURL[cur.spot.id];
  $('#pv').hidden = !src;
  $('#pv').innerHTML = src ? `<img src="${src}" alt="訪問写真"><span class="seal">済</span>` : '';
  $('#ph0').hidden = !!src;
  $('#rm').hidden = !src;
  $('#sv').textContent = src ? 'スタンプを押して保存' : '保存';
}

async function shrink(file) {   // 長辺1600pxのJPEGに縮小して容量を節約
  try {
    const b = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(b.width, b.height));
    const c = document.createElement('canvas');
    c.width = Math.round(b.width * k); c.height = Math.round(b.height * k);
    c.getContext('2d').drawImage(b, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', .85)) || file;
  } catch { return file; }
}

$('#nm').oninput = e => e.target.dataset.d = 1;

function drawChips(id, all, sel) {
  const l = [...new Set([...all, ...sel])];
  $(id).innerHTML = l.map(v => `<label class="chip"><input type="checkbox" value="${esc(v)}" ${sel.includes(v) ? 'checked' : ''}><span>${esc(v)}</span></label>`).join('') + '<button type="button" class="add">＋ 追加</button>';
}
const getChips = id => [...document.querySelectorAll(id + ' input:checked')].map(i => i.value);
const addChip = (id, all, ask, after) => $(id).onclick = e => {
  if (!e.target.closest('.add')) return;
  const n = (prompt(ask) || '').trim().slice(0, 20);
  if (n) { drawChips(id, all(), [...getChips(id), n]); if (after) after(); }
};

// フォルダ選択：選んだ種類ごとに、その種類のフォルダだけを複数選べる
function drawFds() {
  $('#fds').innerHTML = getChips('#cts').map(c => `<div class="lb">フォルダ：${esc(c)}（複数選べます）</div><div class="chips" data-c="${esc(c)}">`
    + folders.filter(f => f.category === c).map(f => `<label class="chip"><input type="checkbox" value="${f.id}" ${cur.fids.includes(f.id) ? 'checked' : ''}><span>${esc(f.name)}</span></label>`).join('')
    + '<button type="button" class="add">＋ 追加</button></div>').join('');
}
addChip('#cts', cats, '新しい種類の名前（例：ロケ地、温泉）', drawFds);
addChip('#tgs', tagList, '作品名・タグの名前（例：ゆるキャン△）');

// 削除モード：チップをタップして、作品・タグ／種類そのものを削除する
async function removeTag(v) {   // 全スポットから外し、候補からも消す（スポットは消えない）
  const moved = spots.filter(x => x.tags.includes(v));
  moved.forEach(x => { x.tags = x.tags.filter(t => t !== v); x.updatedAt = Date.now(); });
  await Promise.all(moved.map(x => Store.save(x)));
  if (F.t === v) F.t = '';
  render();
  drawChips('#tgs', tagList(), getChips('#tgs').filter(t => t !== v));
}
async function removeCat(v) {   // 種類を外し、その種類のフォルダも消す。その種類しかないスポットは「その他」へ
  const now = Date.now(), moved = spots.filter(x => x.categories.includes(v));
  moved.forEach(x => {
    x.categories = x.categories.filter(c => c !== v);
    if (!x.categories.length) x.categories = ['その他'];
    x.folderIds = x.folderIds.filter(id => { const f = folders.find(y => y.id === id); return f && x.categories.includes(f.category); });
    x.updatedAt = now;
  });
  const gone = folders.filter(f => f.category === v);
  await Promise.all([...moved.map(x => Store.save(x)), ...gone.map(f => Store.removeFolder(f.id))]);
  folders = folders.filter(f => f.category !== v);
  if (CATS[v] && !hiddenCats.includes(v)) { hiddenCats.push(v); await Store.setMeta('hiddenCats', hiddenCats); }
  render();
  drawChips('#cts', cats(), getChips('#cts').filter(c => c !== v));
  drawFds();
}
const askTag = v => confirm(`「${v}」を全スポットから外して、候補からも削除しますか？\nスポット自体は消えません。`);
const askCat = v => {
  const only = spots.filter(x => x.categories.length === 1 && x.categories[0] === v).length;
  const fs = folders.filter(f => f.category === v).length;
  if (v === 'その他' && only) { alert(`「その他」にしかないスポットが${only}件あります。先に別の種類を付けてから削除してください。`); return false; }
  return confirm(`種類「${v}」を削除しますか？\n` + (only ? `この種類にしかないスポット${only}件は「その他」に移ります。\n` : '') + (fs ? `この種類のフォルダ${fs}個も削除されます（スポットは消えません）。` : 'スポット自体は消えません。'));
};
function delMode(box, btn, ask, remove) {
  $(btn).onclick = () => { const on = $(box).classList.toggle('del'); $(btn).textContent = on ? '完了' : '削除モード'; };
  $(box).addEventListener('click', async e => {
    const l = e.target.closest('.chip');
    if (!l || !$(box).classList.contains('del')) return;
    e.preventDefault();
    const v = l.querySelector('input').value;
    if (!ask(v)) return;
    try { await remove(v); } catch { toast('削除に失敗しました'); }
  });
}
delMode('#tgs', '#tgm', askTag, removeTag);
delMode('#cts', '#ctm', askCat, removeCat);
$('#cts').onchange = drawFds;
$('#fds').onchange = e => { const i = e.target; cur.fids = i.checked ? [...new Set([...cur.fids, i.value])] : cur.fids.filter(x => x !== i.value); };
$('#fds').onclick = async e => {
  const b = e.target.closest('.add'); if (!b) return;
  const c = b.parentElement.dataset.c, n = askName(`「${c}」の新しいフォルダ名`);
  if (!n) return;
  try { const f = await addFolder(n, c); if (!cur.fids.includes(f.id)) cur.fids.push(f.id); drawFds(); } catch { toast('フォルダを作れませんでした'); }
};
async function addFolder(name, category) {
  const dup = folders.find(f => f.category === category && f.name === name);
  if (dup) return dup;
  const now = Date.now(), f = {id: uid(), name, category, createdAt: now, updatedAt: now};
  await Store.saveFolder(f); folders.push(f); collapsed.add(f.id); render(); return f;
}
$('#cl').onclick = closeSheet;
$('#rm').onclick = () => { cur.photo = null; showPhoto(); };
$('#ph').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  cur.photo = await shrink(f);
  if (cur.url) URL.revokeObjectURL(cur.url);
  cur.url = URL.createObjectURL(cur.photo);
  if (!$('#vd').value) $('#vd').value = today();
  showPhoto();
};

$('#sheet').onsubmit = async e => {
  e.preventDefault();
  const s = cur.spot, now = Date.now(), had = !!photoURL[s.id];
  const cs = getChips('#cts').length ? getChips('#cts') : ['その他'];
  Object.assign(s, {name: $('#nm').value.trim(), region: $('#rg').value, categories: cs, tags: getChips('#tgs'), folderIds: cur.fids.filter(id => { const f = folders.find(x => x.id === id); return f && cs.includes(f.category); }), visitDate: $('#vd').value, memo: $('#mm').value.trim(), updatedAt: now});
  const has = cur.photo === null ? false : cur.photo ? true : had;
  s.visited = has;
  if (has && !s.visitDate) s.visitDate = today();
  if (cur.isNew) s.createdAt = now;
  try { await Store.save(s, cur.photo); } catch { return toast('保存に失敗しました'); }
  if (cur.photo === null) { URL.revokeObjectURL(photoURL[s.id]); delete photoURL[s.id]; }
  else if (cur.photo) { if (had) URL.revokeObjectURL(photoURL[s.id]); photoURL[s.id] = cur.url; cur.url = null; }
  const i = spots.findIndex(x => x.id === s.id);
  i < 0 ? spots.push(s) : spots[i] = s;
  if (!filtered().includes(s)) {   // 保存したスポットが今の絞り込みから外れるときは、見える条件に合わせる
    if (!s.categories.includes(F.c)) F.c = s.categories[0];
    if (F.r && s.region !== F.r) F.r = '';
    if (F.t && !s.tags.includes(F.t)) F.t = '';
  }
  closeSheet(); render();
  toast(has ? 'スタンプを獲得しました' : '保存しました');
};

$('#del').onclick = async () => {
  if (!confirm('このスポットを削除しますか？（写真も削除されます）')) return;
  const id = cur.spot.id;
  try { await Store.remove(id); } catch { return toast('削除に失敗しました'); }
  spots = spots.filter(s => s.id !== id);
  if (photoURL[id]) { URL.revokeObjectURL(photoURL[id]); delete photoURL[id]; }
  closeSheet(); render(); toast('削除しました');
};

let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }

/* ---------- 起動 ---------- */
(async () => {
  try { F.c = localStorage.getItem('stamp-c') || ''; } catch {}
  try {
    spots = (await Store.spots()).map(norm);
    folders = await Store.folders();
    hiddenCats = (await Store.getMeta('hiddenCats')) || [];
    // 旧フォルダ（種類なし）は、入っているスポットで一番多い種類のフォルダにする
    for (const f of folders) if (!f.category) {
      const n = {};
      spots.filter(x => x.folderIds.includes(f.id)).forEach(x => { const c = x.categories[0]; if (c) n[c] = (n[c] || 0) + 1; });
      f.category = Object.keys(n).sort((a, b) => n[b] - n[a])[0] || 'その他';
      Store.saveFolder(f).catch(() => {});
    }
    folders.forEach(f => collapsed.add(f.id));   // フォルダは最初は折りたたむ（未分類は開いたまま）
    for (const p of await Store.photos()) photoURL[p.spotId] = URL.createObjectURL(p.blob);
  } catch { toast('保存領域を開けませんでした（プライベートブラウズでは動かない場合があります）'); }
  render(); fit();
})();
</script>
</body>
</html>
